{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:80vh">
  <div class="text-center">
    <div style="font-size:6rem;font-weight:800;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent">500</div>
    <h2 class="fw-bold mb-2">Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong on our end. Check the error logs for details.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary me-2"><i class="bi bi-house me-2"></i>Dashboard</a>
    <a href="{{ url_for('logs.index') }}" class="btn btn-outline-secondary"><i class="bi bi-journal me-2"></i>View Logs</a>
  </div>
</div>
{% endblock %}
