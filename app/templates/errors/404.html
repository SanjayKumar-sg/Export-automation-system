{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:80vh">
  <div class="text-center">
    <div style="font-size:6rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">404</div>
    <h2 class="fw-bold mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The page you're looking for doesn't exist or was moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="bi bi-house me-2"></i>Back to Dashboard</a>
  </div>
</div>
{% endblock %}
